  <!-- ===================================
       CRITICAL PERFORMANCE OPTIMIZATIONS
  =================================== -->
  
  <!-- PRECONNECT to external domains (saves DNS + TLS handshake time) -->
  <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://appleid.cdn-apple.com">

  <link rel="preload" as="image" href="https://assets.8jjgames.com/8jj_background/8jj-games-bg.webp" fetchpriority="high" crossorigin>
  
  <!-- PRELOAD CRITICAL FONTS - Self-hosted for performance -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/nunito-variable.woff2" crossorigin>
  
  
  <!-- FAVICON -->

  <!-- SELF-HOSTED FONTS (instead of Google Fonts) -->
  <style>
    /* Inline to prevent render blocking */
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('/fonts/nunito-variable.woff2') format('woff2');
    }
    
    /* Prevent layout shift during font load */
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- ===================================
       IMMEDIATE TITLE SET (PREVENTS FLASH)
  =================================== -->
  <script>
    // Set title immediately before React loads
    document.title = '8JJ Games - Free Online Games';
  </script>


  <script>
    // Delay GTM until after page is interactive (saves ~190ms TBT)
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CJKGMQP0L0';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-CJKGMQP0L0', { anonymize_ip: true });
      }, 2000); // 2s after load — user is interactive, GA still fires
    });
  </script>

  <!-- APPLE SIGNUP - DEFERRED -->
